[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-job-scout"
version = "0.1.0"
description = "Локальный агент для поиска подходящих удалённых QA-вакансий"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4==4.12.3",
    "openai>=1.40.0,<2.0.0",
    "playwright==1.50.0",
    "python-dotenv==1.0.1",
    "httpx>=0.27,<1.0",
]

[tool.setuptools.packages.find]
include = ["qa_job_scout*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"