[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-job-scout"
version = "0.1.0"
description = "Локальный агент для поиска подходящих удалённых QA-вакансий"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["qa_job_scout*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"