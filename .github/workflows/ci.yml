name: QA Job Scout CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff
        run: ruff check .

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      - name: Run tests
        run: |
          pytest \
            -v \
            --junitxml=test-results.xml \
            --cov=qa_job_scout \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: test-results.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: coverage.xml

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download coverage report
        uses: actions/download-artifact@v6
        with:
          name: coverage-report
          path: coverage-data

      - name: Check coverage
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET

          coverage_file = "coverage-data/coverage.xml"

          root = ET.parse(coverage_file).getroot()

          line_rate = float(root.attrib["line-rate"])
          coverage = line_rate * 100

          print(f"Coverage: {coverage:.2f}%")

          minimum_coverage = 40.0

          if coverage < minimum_coverage:
              raise SystemExit(
                  f"Coverage {coverage:.2f}% is below required "
                  f"{minimum_coverage:.2f}%"
              )

          print(
              f"Coverage check passed: "
              f"{coverage:.2f}% >= {minimum_coverage:.2f}%"
          )
          PY
